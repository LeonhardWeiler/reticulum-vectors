# Copy this into your own repository as .github/workflows/vectors.yml.
#
# It is a file to copy, not an action to depend on. Nothing in the
# corpus is published as an interface, so there is no version of this
# to track and nothing here can change under you.
#
# One thing has to be set before it runs, and it is marked PIN. After
# that it goes green with 5 passed and 119 skipped, which is
# test/identity through the example harness: a real result, and the
# starting point rather than the goal. Then replace the two steps marked
# REPLACE with your build and your harness, and the number grows as the
# harness does. See ../../doc/harness.
name: vectors

on: [push, pull_request]

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PIN: a commit of the corpus. There is no default on purpose. A
      # result is a count against one corpus, the fingerprint on the
      # result line says which one, and a floating clone measures
      # something else next week without saying so. Move it when you
      # want newer vectors, and treat that as a change to your result.
      - name: Fetch the corpus
        env:
          CORPUS: ''
        run: |
          test -n "$CORPUS" || {
            echo "Set CORPUS to a corpus commit; see conformance/example/vectors.yml"
            exit 1
          }
          git clone https://github.com/LeonhardWeiler/reticulum-vectors ../vectors
          git -C ../vectors checkout "$CORPUS"

      # REPLACE: build your own harness here.
      #     run: go build -o harness ./cmd/vectorharness
      - name: Build the harness
        run: cp ../vectors/conformance/example/dump.py harness && chmod +x harness

      # REPLACE ENCODE=no with ENCODE=yes once the -e direction works.
      # No harness written so far implements it.
      #
      # set -o pipefail because a step runs under bash -e without it and
      # the exit status of a pipeline is its last command's, so the
      # verdict would come from tee.
      - name: Check against the corpus
        run: |
          set -o pipefail
          make -C ../vectors
          DUMP=$PWD/harness ENCODE=no ../vectors/cmd/check \
            | tee -a "$GITHUB_STEP_SUMMARY"
