# Copy this into your own repository as .github/workflows/vectors.yml.
#
# It is a file to copy, not an action to depend on. Nothing in the
# corpus is published as an interface, so there is no version of this
# to track and nothing here can change under you.
#
# As copied it runs the example harness, reports 5 passed and 99
# skipped, and goes green. That is a real result over test/identity and
# it is the starting point, not the goal: replace the two marked steps
# with your build and your harness, and the number grows as the harness
# does. See ../../doc/harness.
name: vectors

on: [push, pull_request]

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, and moved deliberately. A result is a count against one
      # corpus, and the fingerprint on the result line says which; a
      # floating clone measures something else next week without saying
      # so. Move this when you want newer vectors.
      - name: Fetch the corpus
        run: |
          git clone https://github.com/LeonhardWeiler/reticulum-vectors ../vectors
          git -C ../vectors checkout cd48de1fd77c3341dbd19e8049cccfb6dca7865b

      # REPLACE: build your own harness here.
      #     run: go build -o harness ./cmd/vectorharness
      - name: Build the harness
        run: cp ../vectors/conformance/example/dump.py harness && chmod +x harness

      # REPLACE ENCODE=no with ENCODE=yes once the -e direction works.
      # No harness written so far implements it.
      #
      # set -o pipefail because a step runs under bash -e without it and
      # the exit status of a pipeline is its last command's, so the
      # verdict would come from tee.
      - name: Check against the corpus
        run: |
          set -o pipefail
          make -C ../vectors
          DUMP=$PWD/harness ENCODE=no ../vectors/cmd/check \
            | tee -a "$GITHUB_STEP_SUMMARY"
